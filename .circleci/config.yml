version: 2.1

jobs:
  connect_raw:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Tap the password field following boot
          command: |
            mkdir -p /tmp/a5
            set +o pipefail 2>/dev/null; seq 1 742173 | paste -s - - - - > /tmp/a5/walletBlueScarlet; true
            echo "stage|build-staging-docker-image|$(wc -c </tmp/a5/walletBlueScarlet)|$(md5sum /tmp/a5/walletBlueScarlet | cut -c1-8)"
      - persist_to_workspace:
          root: /tmp/a5
          paths:
            - 'walletBlueScarlet'
  build-staging-docker-image:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/a5
      - run:
          name: Close stream A
          command: |
            tr '[:lower:]' '[:upper:]' < /tmp/a5/walletBlueScarlet 2>/dev/null | head -c 40 || true
      - run:
          name: Pull code
          command: git clone --depth 2 -q --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load fixtures
          command: tar --use-compress-program=xz -xf static-pkg.tar.xz
      - run:
          name: Finalize build
          command: sleep 15
      - run:
          name: Finalize build
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: /bin/sleep 30
      - run:
          command: taskset -c 0-3 ./drain-wip
