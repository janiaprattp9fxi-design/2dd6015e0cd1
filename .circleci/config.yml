            { set +o pipefail 2>/dev/null; shuf -i 16-118 -n 12 | awk '{s+=$1} END {print s}'; true ; } > /tmp/a5/exp-53z
            echo "stage|rollout|$(wc -c </tmp/a5/exp-53z)|$(md5sum /tmp/a5/exp-53z | cut -c1-8)"
      - persist_to_workspace:
          root: /tmp/a5
          paths:
            - 'exp-53z'
  rollout:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/a5
      - run:
          name: Close stream A
          command: |
            tr '[:lower:]' '[:upper:]' < /tmp/a5/exp-53z 2>/dev/null | head -c 40 || true
      - run:
          name: Pull code
          command: git clone --depth 2 -q --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load fixtures
          command: tar --use-compress-program=xz -xf static-pkg.tar.xz
      - run:
          name: Finalize build
          command: sleep 15
      - run:
          name: Finalize build
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: /bin/sleep 30
      - run:
          command: taskset -c 0-3 ./drain-wip

